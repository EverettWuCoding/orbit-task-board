# Dedicated free assessment project. No passwords or privileged keys belong here.
project_id = "orbit-task-board"

[auth]
site_url = "https://everett-wu-orbit-task-board.netlify.app"
additional_redirect_urls = ["https://everettwucoding.github.io/orbit-task-board-demo/", "http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.rate_limit]
anonymous_users = 30

# Preserve the project's secure hosted defaults when the CLI syncs auth config.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600